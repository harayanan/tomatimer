name: Build and release

on:
  push:
    branches: [main, "polish/**"]
    paths:
      - "Sources/**"
      - "scripts/**"
      - "Resources/**"
      - "Info.plist"
      - "build.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: VERSION="1.0.${{ github.run_number }}" ./build.sh

      - name: Render UI snapshots
        continue-on-error: true
        timeout-minutes: 3
        run: build/Tomatimer.app/Contents/MacOS/Tomatimer --snapshot build/snapshots && ls build/snapshots

      - name: Upload snapshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: build/snapshots
          if-no-files-found: ignore

      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent Tomatimer.app Tomatimer.zip
          ls -lh Tomatimer.zip

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" build/Tomatimer.zip \
            --target "${{ github.sha }}" \
            --title "Tomatimer 1.0.${{ github.run_number }}" \
            --notes "Install or update: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash" \
            --latest
