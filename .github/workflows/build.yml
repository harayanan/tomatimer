name: Build and release

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "scripts/**"
      - "Info.plist"
      - "build.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: VERSION="1.0.${{ github.run_number }}" ./build.sh

      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent Tomatimer.app Tomatimer.zip
          ls -lh Tomatimer.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" build/Tomatimer.zip \
            --target "${{ github.sha }}" \
            --title "Tomatimer 1.0.${{ github.run_number }}" \
            --notes "Install or update: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash" \
            --latest
